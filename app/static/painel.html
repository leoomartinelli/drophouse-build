:root{--bg:#111513;--card:#171C1A;--card2:#1E2422;--bord:#28302D;--txt:#F2F7F3;--mut:#A0AAA4;
--lima:#70D068;--lima-a:rgba(112,208,104,.13);--azul:var(--lima);--verde:var(--lima);--verm:#FF5A47;--lar:#FFB020;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:var(--lima);color:#0A2E2B}
a{color:var(--lima)}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1,h2{font-family:Inter,system-ui,sans-serif}
h1{font-weight:800;text-transform:uppercase}
h2{font-weight:700;letter-spacing:-.01em}
h1{font-size:1.9rem;line-height:1;margin:0}h2{font-size:1.1rem;margin:0 0 .7rem}
h2 .mini{font-weight:400;text-transform:none}
.marca{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:1.25rem;letter-spacing:-.045em;font-weight:300}
.marca b{font-weight:800}
/* simbolo animado: mesmo do index (style.css), copiado porque o painel e autocontido */
.simbolo{position:relative;display:inline-block;width:32px;height:32px;flex:none;cursor:pointer}
.simbolo>svg,.dh-caixa>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.simbolo .dh-caixa{position:absolute;inset:0;transform-origin:50% 92%;animation:dh-pulo 7s cubic-bezier(.16,1,.3,1) infinite}
.dh-olhos{position:absolute;inset:0}
.dh-olho{position:absolute;left:47.5%;top:56.7%;width:15.4%;height:26.2%;border-radius:50%;background:#fdfdfd}
.dh-olho+.dh-olho{left:69.9%;top:52.3%}
.simbolo .dh-olhos{animation:dh-olhar 7s ease-in-out infinite}
.simbolo .dh-olho{animation:dh-piscar 7s infinite}
.simbolo.segue .dh-olhos{animation:none;translate:var(--ox,0) var(--oy,0);transition:translate .12s ease-out}
span.simbolo.pula .dh-caixa{animation:dh-pulinho .9s cubic-bezier(.16,1,.3,1)}
span.simbolo.pula .dh-olho{animation:dh-apertar .9s ease-in-out}
span.simbolo.pula+.wordmark{animation:dh-esbarra .9s}
@keyframes dh-pulinho{0%{transform:none}14%{transform:scale(1.1,.86)}42%{transform:translateY(-34%) rotate(-11deg) scale(.94,1.08)}66%{transform:translateY(0) rotate(4deg) scale(1.12,.86)}82%{transform:translateY(-7%) rotate(-1deg) scale(.98,1.03)}100%{transform:none}}
@keyframes dh-apertar{0%,100%{scale:1 1}20%,70%{scale:1.05 .35}}
.marca .wordmark{display:inline-block;transform-origin:0 100%;animation:dh-esbarra 7s infinite}
@keyframes dh-olhar{0%,10%{translate:0 0}14%,28%{translate:-4.9% 1.2%}32%,46%{translate:4.3% -.9%}50%,64%{translate:0 0}70%,86%{translate:3.2% -2.1%}92%,100%{translate:0 0}}
@keyframes dh-piscar{0%,38%,42%,95%,100%{scale:1 1}40%,97%{scale:1 .08}}
@keyframes dh-pulo{0%,64%{transform:none}68%{transform:scale(1.06,.92)}74%{transform:translateY(-14%) rotate(-7deg) scale(.96,1.05)}80%{transform:translateY(0) rotate(2deg) scale(1.08,.9)}85%{transform:translateY(-3%) rotate(0) scale(.98,1.02)}90%,100%{transform:none}}
@keyframes dh-esbarra{0%,79%{transform:none}82%{transform:translateX(4px) rotate(2.5deg)}86%{transform:translateX(-1px) rotate(-.8deg)}90%,100%{transform:none}}
@media(prefers-reduced-motion:reduce){.dot,.pt,.simbolo,.simbolo *,.marca .wordmark{animation:none!important}}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:620px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border:1px solid var(--bord);border-radius:20px;padding:16px 18px}
.tile b{display:block;font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:2.1rem;line-height:1.05;color:var(--lima);font-variant-numeric:tabular-nums}
.tile span{color:var(--mut);font-size:.8rem}
.tile.zero b{color:var(--mut)} /* zero nao e destaque: lime so quando ha algo */
.card{background:var(--card);border:1px solid var(--bord);border-radius:20px;padding:18px;margin-bottom:14px}
.item{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 12px;border-radius:12px;
background:var(--card2);border:1px solid var(--bord);margin:6px 0}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item.ocup{border-color:rgba(255,176,32,.55)}
.pill{flex:none;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px;color:#131313;background:#8A8A84}
.pill.livre{background:var(--lima)}.pill.ocupado{background:var(--lar)}.pill.offline{background:var(--verm);color:#131313}
.n{flex:none;font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card2);border:1px solid var(--bord);border-radius:999px;padding:4px 12px}
.chip.agora{border-color:var(--lar)}
progress{-webkit-appearance:none;appearance:none;width:100%;height:8px;margin-top:8px;border:0;border-radius:999px;overflow:hidden;background:var(--card2)}
progress::-webkit-progress-bar{background:var(--card2)}progress::-webkit-progress-value{background:var(--lima);border-radius:999px}
progress::-moz-progress-bar{background:var(--lima)}
.vazio{color:var(--mut);margin:4px 0}
.pt{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);margin-right:8px;vertical-align:middle}
.pt.concluido{background:var(--lima)}.pt.erro{background:var(--lar)}.pt.rodando{background:var(--lima);animation:vivo 1.6s ease-in-out infinite}
/* quadro de envios ao Drive: o mesmo da tela do PC, juntando todos os PCs */
#uploads{position:fixed;right:12px;bottom:12px;width:330px;max-height:60vh;overflow:auto;background:var(--card);
border:1px solid #3C3C3C;border-radius:20px;box-shadow:0 22px 50px -16px rgba(0,0,0,.8);padding:12px 14px;z-index:60}
@media(max-width:620px){#uploads{left:8px;right:8px;bottom:8px;width:auto;max-height:45vh}}
#uploads .uphead{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px;font-size:.9rem}
/* mascote do envio: a caixa do logo com fotos subindo (mesmo do app; so transform e opacity, em elementos de HTML) */
#uploads .uphead b{display:flex;align-items:center;gap:8px}
.mascote{position:relative;display:inline-block;flex:none;width:var(--m);height:var(--m);line-height:0}
.m-corpo{position:absolute;inset:0;transform-origin:50% 92%}.m-corpo>svg{display:block;width:100%;height:100%;overflow:visible}
.m-olhos{position:absolute;inset:0}
.m-olho{position:absolute;left:49.9%;top:51.4%;width:14.1%;height:23.5%;border-radius:50%;background:#fdfdfd}.m-olho+.m-olho{left:70.4%;top:47.4%}
.m-foto{position:absolute;left:36%;top:-4%;width:26%;height:19%;border-radius:2px;background:#DDFDE6;box-shadow:inset 0 0 0 1px #0B6D67;opacity:0;z-index:1}
.m-foto:nth-of-type(2){left:28%}.m-foto:nth-of-type(3){left:46%}
.m-enviando .m-olhos{translate:0 -4.6%}
.m-enviando .m-foto{animation:m-sobe 1.2s cubic-bezier(.2,.6,.4,1) infinite}
.m-foto:nth-of-type(2){animation-delay:.4s!important}.m-foto:nth-of-type(3){animation-delay:.8s!important}
.m-feliz-pula .m-corpo{animation:dh-pulinho .9s cubic-bezier(.16,1,.3,1)}.m-feliz-pula .m-olho{animation:dh-apertar .9s ease-in-out}
@keyframes m-sobe{0%{opacity:0;transform:translateY(150%)}25%{opacity:1}100%{opacity:0;transform:translateY(-120%)}}
@media(prefers-reduced-motion:reduce){.mascote *{animation:none!important}}
.pt.parado{background:var(--mut)}
#uploads .uphead button{cursor:pointer;border:1px solid #3C3C3C;border-radius:999px;width:28px;height:28px;padding:0;font:inherit;font-weight:700;color:var(--txt);background:transparent}
#uploads progress{height:9px;margin:3px 0}
.upjob{padding:6px 0;border-top:1px solid var(--bord)}.upjob:first-of-type{border-top:0}
.uprow{display:flex;justify-content:space-between;gap:6px}
.upjob.concluido progress::-webkit-progress-value{background:var(--lima)}
.upjob.erro progress::-webkit-progress-value{background:var(--lar)}
.upfiles{font-size:.8rem;margin:2px 0 3px;font-family:ui-monospace,monospace}
.upfiles div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap"><div class="marca"><span class="simbolo" aria-hidden="true"><svg class="dh-fundo" viewBox="56 22 694 682"><defs><clipPath id="dh-recorte"><path d="M816.16,37.08h-384.31c-3.59,0-7.15.1-10.68.28-24.42-14.74-56.27-23.65-91.1-23.65H-54.25c-76.92,0-139.27,43.47-139.27,97.09v258.45c0,53.62,62.35,97.09,139.27,97.09h125.87v123.87c0,53.62,62.35,97.09,139.27,97.09h384.31c76.92,0,139.27-43.47,139.27-97.09v-100.5h81.68c76.92,0,139.27-43.47,139.27-97.09V134.18c0-53.62-62.35-97.09-139.27-97.09Z"/></clipPath><radialGradient id="dh-g1" cx="329.35" cy="294.97" r="623.52" gradientTransform="translate(-39.03 33.82) rotate(-4.54)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#70d068"/><stop offset=".17" stop-color="#6aca67"/><stop offset=".39" stop-color="#5abb67"/><stop offset=".63" stop-color="#40a167"/><stop offset=".89" stop-color="#1c7e67"/><stop offset="1" stop-color="#0b6d67"/></radialGradient><radialGradient id="dh-g2" href="#dh-g1" cx="329.36" cy="268.51" r="571.38"/><radialGradient id="dh-g3" href="#dh-g1" cx="635.5" cy="164.16" r="620.18"/><radialGradient id="dh-g4" href="#dh-g1" cx="741.71" cy="21.06" r="873.48"/><radialGradient id="dh-g5" href="#dh-g1" cx="564.69" cy="435.6" r="399.72"/></defs><rect fill="#ddfde6" x="71.62" y="38.03" width="662.86" height="649.28" rx="139.27"/></svg><span class="dh-caixa"><svg viewBox="56 22 694 682"><g clip-path="url(#dh-recorte)"><path fill="url(#dh-g1)" d="M349.31,749.7c-5.46-.01-10.59-.85-16.11-3.58l-195.29-96.59c-10.98-5.43-17.29-18.47-18.27-29.88l-3.92-45-6.2-86.52-1.48-20.72-4.56-56.84-2.36-31.57,95.7,36.02c11.36,4.27,24.1-1.39,31.33-10.84,25.37-33.18,50.57-65.46,78.34-96.74.6-.69,1.18-.89,1.78-.2l30.02,390.9,2.92,36.69c.68,8.61,2.7,9.74,8.12,14.87Z"/><path fill="url(#dh-g2)" d="M691.72,356.32c.81,1.99,1.29,4.62,1.51,7.43l11.9,160.17,6.38,85.01c1,13.29-6.98,27.92-20.19,32.19l-168.18,54.37-147.94,47.21-7.68,2.71c-6.16,2.17-12,4.33-18.22,4.3-5.42-5.13-7.43-6.27-8.12-14.87l-2.92-36.69-30.02-390.9,71.59,80.67c1.59,1.79,3.98,3.27,6.2,4.26l6.34,2.8c9.19,4.07,18.58,2.85,28.43-.03l204.86-59.92,63.35-18.39,3.22,34.48-.53,5.22Z"/><path fill="url(#dh-g3)" d="M761.74,287.54c-1.1,3.59-4.35,8.55-9.17,10l-63.54,19.08-63.35,18.39-204.86,59.92c-9.85,2.88-19.24,4.09-28.43.03l-6.34-2.8c-2.22-.99-4.61-2.47-6.2-4.26l-71.59-80.67c-.6-.69-1.18-.49-1.78.2-27.77,31.27-52.97,63.56-78.34,96.74-7.23,9.45-19.97,15.12-31.33,10.84l-95.7-36.02-83.75-32.66c-7.57-2.95-8.2-12.47-5.46-18.02,2.13-4.34,4.47-6.22,7.25-9.56l7.4-8.89c2.49-2.99,5.34-5.75,7.53-8.8,2.04-2.84,4.52-4.57,6.64-7.11,9.58-11.44,19.09-22.39,29.22-33.44l21.74-23.72c1.39-1.51,3.66-1.91,3.83-4.39,5.65.9,12.23-1.66,17.69.2l128.27,43.71,60.85,21.45c4.12,1.45,7.46,2.59,12.22,1.26l310.86-87.09c1.58-2.96,3.96-1.41,5.98-1.95l27.91-7.46,13.93-1.76,45.41,39.3,38.85,33.43c4.03,3.48,5.8,8.98,4.25,14.05Z"/><path fill="url(#dh-g4)" d="M741.57,114.64l-19.76,25.36c-6.26,8.03-12.35,15.47-18.74,23.48l-16.22,20.3-10.44,13.62c-.79,1.03-1.98,1.78-2.82,2.06l-.37,1.29-13.93,1.76-42.44-10.91-188.15-49.97-2.55-1.39c-1.01-.55-1.57.75-2.44,1.01l-159.2,47.13-151.31,44.22c-5.46-1.86-12.04.7-17.69-.2l-23.37-24.55-41.25-43.02c-4.44-4.64-5.93-11.37-3.42-16.94,3.03-6.74,8.91-9.87,15.91-11.87l108.79-31.13,184.27-49.36c11.61-3.11,25.24.23,32.31,9.23l22.08,28.15,12.59,16.13,21.32,27.11,8.3-10.5,36.61-43.27,5.16-6.49,11.96-14.24c8.27-11.25,22.37-18.83,36.96-15.56l78.97,17.7c11.11,2.5,21.17,4.37,32.3,6.83l96.4,21.37c5.26,1.16,9.32,4.55,10.91,8.27,1.98,4.61,2.29,10.48-.73,14.36Z"/><path fill="url(#dh-g5)" d="M659.3,202.51l-27.91,7.46c-2.03.54-4.4-1.01-5.98,1.95l-310.86,87.09c-4.76,1.33-8.1.19-12.22-1.26l-60.85-21.45-128.27-43.71,151.31-44.22,159.2-47.13c.87-.26,1.44-1.56,2.44-1.01l2.55,1.39,188.15,49.97,42.44,10.91Z"/></g></svg><span class="dh-olhos"><i class="dh-olho"></i><i class="dh-olho"></i></span></span></span><span class="wordmark">drop<b>house</b></span></div><div id="app"><p class="mut">Carregando painel…</p></div></div>
<div id="uploads" class="hidden"></div>
<script>
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let D = null, chegou = 0, online = true;

function dur(s) {
  s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  if (h) return `${h} h ${String(m).padStart(2, '0')} min`;
  return m ? `${m} min ${String(ss).padStart(2, '0')} s` : `${ss} s`;
}
// o tempo vem do proprio PC (relogios diferentes nao atrapalham) e continua contando aqui entre as atualizacoes
const decorrido = s => dur(s + (performance.now() - chegou) / 1000);
const nomePC = e => `${e.papel === 'lider' ? 'PC Líder' : 'PC Auxiliar'} <span class="mut mini">(${esc(e.estacao || e.nome)})</span>`;
const dataBR = d => (d || '').split('-').reverse().join('/');
const FASE = { selecionando: 'descarregando', copiando: 'copiando as fotos', concluido: 'revisando / enviando ao Drive' };

function frase(a) {
  const quem = a.voluntario ? ` pelo voluntário <b>${esc(a.voluntario)}</b>` : '';
  const prog = a.fase === 'copiando' && a.total ? ` (${a.feitos}/${a.total})` : '';
  return `${nomePC(a)} ocupado${quem}, ${FASE[a.fase] || 'descarregando'}${prog} há <b class="tempo" data-s="${a.segundos}">${decorrido(a.segundos)}</b>`;
}

function desenha() {
  if (!D) return;
  if (D.modo === 'auxiliar') {
    const l = D.lider;
    $app.innerHTML = `<div class="card"><h2>Esta é uma estação auxiliar</h2><p>O painel fica no PC Líder.${l ? ` Abra <a href="http://${esc(l.ip)}:${l.port}/painel">http://${esc(l.ip)}:${l.port}/painel</a>.` : ''}</p></div>`;
    return;
  }
  if (!D.servir) { $app.innerHTML = `<div class="card"><h2>Nenhum Servir ativo</h2><p class="mut">Assim que o líder iniciar um Dia de Servir, o painel aparece aqui sozinho.</p></div>`; return; }
  const g = D.gerais;
  $app.innerHTML = `
  <div class="top"><div><h1>${esc(D.servir.nome)}</h1><div class="mut mini">Painel de acompanhamento · ${esc(dataBR(D.servir.data))}</div></div>
   <div class="mini mut" style="text-align:right"><span class="dot ${online ? '' : 'off'}"></span>${online ? 'ao vivo' : 'sem conexão'}<br>atualizado ${esc(D.atualizado)}</div></div>
  <div class="tiles">
   <div class="tile ${g.total_fotos ? '' : 'zero'}"><b>${g.total_fotos}</b><span>fotos descarregadas</span></div>
   <div class="tile ${g.ja_descarregaram ? '' : 'zero'}"><b>${g.ja_descarregaram}/${g.voluntarios}</b><span>voluntários já descarregaram</span></div>
   <div class="tile ${g.pcs_ocupados ? '' : 'zero'}"><b>${g.pcs_ocupados}</b><span>PC(s) ocupado(s) agora</span></div>
   <div class="tile ${g.pcs_livres ? '' : 'zero'}"><b>${g.pcs_livres}/${g.pcs}</b><span>PC(s) livre(s)${g.pcs_offline ? ` · <span class="bad">${g.pcs_offline} sem resposta</span>` : ''}</span></div>
  </div>
  ${(D.versoes_diferentes || []).length ? `<div class="card" style="border-color:var(--lar)"><b class="warn">PCs com versão diferente do líder (v${esc(D.versao_lider)}):</b> ${D.versoes_diferentes.map(esc).join(', ')}.<br><span class="mini mut">Instale a mesma versão em todos os PCs para que a numeração e as estatísticas fiquem certas.</span></div>` : ''}
  <div class="card"><h2>Descarregando agora</h2>
   ${D.agora.map(a => `<div class="item ocup"><span class="t">${frase(a)}${a.fase === 'copiando' && a.total ? `<progress value="${a.feitos}" max="${a.total}"></progress>` : ''}</span></div>`).join('') || '<p class="vazio">Ninguém descarregando no momento.</p>'}
  </div>
  <div class="card"><h2>Faltam descarregar <span class="mut mini">(${D.faltam.length})</span></h2>
   <div class="chips">${D.faltam.map(f => `<span class="chip ${f.descarregando_agora ? 'agora' : ''}">${esc(f.voluntario)}${f.descarregando_agora ? ' <span class="warn mini">· descarregando agora</span>' : ''}</span>`).join('') || '<p class="vazio ok">Todos os voluntários já descarregaram.</p>'}</div>
  </div>
  <div class="card"><h2>PCs conectados</h2>
   ${D.estacoes.map(e => {
     const a = e.atividade || {}, st = !e.online ? 'offline' : e.sem_suporte ? '' : a.estado;
     const rot = { livre: 'Livre', ocupado: 'Ocupado', offline: 'Sem resposta' }[st] || 'Conectado';
     const det = st === 'ocupado' ? `<br><span class="mini mut">${a.voluntario ? esc(a.voluntario) + ' · ' : ''}há <span class="tempo" data-s="${a.segundos}">${decorrido(a.segundos)}</span></span>`
       : e.sem_suporte ? '<br><span class="mini mut">versão sem status (atualize esta estação)</span>' : '';
     return `<div class="item"><span class="t">${nomePC(e)} <span class="mini mut">${esc(e.ip || '')} · ${e.versao ? 'v' + esc(e.versao) : 'versão ?'}</span>${e.online && e.versao !== D.versao_lider ? ' <span class="mini warn">· versão diferente do líder</span>' : ''}${det}</span><span class="pill ${st}">${rot}</span></div>`;
   }).join('')}
   ${D.estacoes.length === 1 ? '<p class="mut mini">Nenhum PC auxiliar conectado ao líder.</p>' : ''}
  </div>
  <div class="card"><h2>Já descarregaram <span class="mut mini">(${D.ja_descarregaram.length})</span></h2>
   ${D.ja_descarregaram.map(v => `<div class="item"><span class="t"><b>${esc(v.voluntario)}</b><br><span class="mini mut">${v.vezes} descarregamento(s)${Object.keys(v.categorias).length ? ' · ' + Object.entries(v.categorias).map(([c, n]) => `${esc(c)} (${n})`).join(', ') : ''}${v.estacoes.length ? ' · ' + v.estacoes.map(esc).join(', ') : ''}${v.ultimo ? ' · último às ' + esc(v.ultimo.slice(11, 16)) : ''}</span></span><span class="n">${v.fotos} <span class="mini mut">fotos</span></span></div>`).join('') || '<p class="vazio">Ninguém descarregou ainda.</p>'}
  </div>
`;
}

const $up = document.getElementById('uploads');
let upMin = false, upUlt = '';
try { upMin = localStorage.getItem('painelUploadsMin') === '1'; } catch (e) { }
function desenhaUploads() {
  const lista = (D && D.servir && D.uploads) || [];
  const chave = JSON.stringify(lista) + upMin;
  if (chave === upUlt) return; upUlt = chave;   // so redesenha quando muda (nao perde a rolagem)
  if (!lista.length) { $up.classList.add('hidden'); document.body.style.paddingBottom = ''; return; }
  $up.classList.remove('hidden');
  const ativo = j => j.estado === 'fila' || j.estado === 'rodando';
  const ativos = lista.filter(ativo), feitos = lista.reduce((a, j) => a + j.feitos, 0), total = lista.reduce((a, j) => a + j.total, 0);
  const ordem = lista.slice().reverse().sort((a, b) => ativo(b) - ativo(a));   // em andamento primeiro, depois os mais recentes
  // o cabecalho (com o mascote) e montado uma vez: a animacao nao recomeca a cada atualizacao
  if (!$up.firstChild) {
    const caixa = document.querySelector('.simbolo .dh-caixa svg');
    const desenho = caixa ? caixa.innerHTML.replace(' clip-path="url(#dh-recorte)"', '') : '';
    $up.innerHTML = `<div class="uphead"><b><span class="mascote m-parado" style="--m:26px" aria-hidden="true"><i class="m-foto"></i><i class="m-foto"></i><i class="m-foto"></i><span class="m-corpo"><svg viewBox="6 18 760 760">${desenho}</svg><span class="m-olhos"><i class="m-olho"></i><i class="m-olho"></i></span></span></span><span id="up-tit"></span></b><button id="up-min"></button></div><div id="up-corpo"></div>`;
    $up.querySelector('#up-min').onclick = () => { upMin = !upMin; try { localStorage.setItem('painelUploadsMin', upMin ? '1' : '0'); } catch (e) { } upUlt = ''; desenhaUploads(); };
  }
  $up.querySelector('#up-tit').textContent = ativos.length ? `Enviando ao Drive · ${ativos.length} em andamento` : 'Envios ao Drive concluídos';
  const bm = $up.querySelector('#up-min'); bm.textContent = upMin ? '+' : '−'; bm.setAttribute('aria-label', upMin ? 'Expandir' : 'Minimizar');
  // mascote: fotos subindo enquanto envia; acabou tudo (sem parar no meio): pulinho de alegria
  const m = $up.querySelector('.mascote'), estado = ativos.length ? 'enviando' : 'parado';
  if (m.dataset.e !== estado) {
    const festa = m.dataset.e === 'enviando' && lista.every(j => j.estado === 'concluido');
    m.dataset.e = estado; m.className = 'mascote m-' + (festa ? 'feliz-pula' : estado);
    if (festa) m.addEventListener('animationend', () => { m.className = 'mascote m-parado'; }, { once: true });
  }
  $up.querySelector('#up-corpo').innerHTML = `
    ${upMin ? `<progress value="${total ? feitos / total : 0}" max="1"></progress>` : ordem.map(j => `<div class="upjob ${esc(j.estado)}">
      <div class="uprow"><span><i class="pt ${esc(j.estado)}"></i><b>${esc(j.fotografo)}</b></span><span class="mini">${j.feitos}/${j.total}</span></div>
      <div class="mini mut">${j.papel === 'lider' ? 'PC Líder' : 'PC Auxiliar'} (${esc(j.estacao)})</div>
      <progress value="${j.progresso}" max="1"></progress>
      ${j.estado === 'rodando' && (j.atuais || []).length ? `<div class="upfiles">${j.atuais.map(n => `<div title="${esc(n)}">${esc(n)}</div>`).join('')}</div>` : ''}
      <div class="mini mut">${esc(['concluido', 'erro', 'parado'].includes(j.estado) || j.parar ? j.msg : j.estado === 'fila' ? 'Na fila de envio...' : 'Enviando para ' + j.destino)}${j.erros ? ` · <span class="bad">${j.erros} com erro</span>` : ''}</div></div>`).join('')}`;
  // no celular o quadro fica embaixo: deixa espaco para rolar o painel ate o fim
  document.body.style.paddingBottom = innerWidth <= 620 ? ($up.offsetHeight + 16) + 'px' : '';
}

async function atualiza() {
  try {
    const r = await fetch('/painel/dados', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    D = await r.json(); chegou = performance.now(); online = true;
  } catch (e) { online = false; }
  desenha(); desenhaUploads();
}
// so o tempo muda a cada segundo: atualiza o texto sem redesenhar a pagina
setInterval(() => document.querySelectorAll('.tempo').forEach(t => { t.textContent = decorrido(+t.dataset.s); }), 1000);
setInterval(atualiza, 2000); atualiza();
// ---------- olhinhos do simbolo seguem o mouse; com o mouse parado por 3s voltam a olhar em volta ----------
(() => {
  const sim = document.querySelector('.simbolo');
  if (!sim || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let x = 0, y = 0, pedido = 0, parado = 0;
  // clique: pula de novo a cada clique, mesmo no meio de um pulo (tira a classe, forca o reflow e poe de volta)
  sim.addEventListener('click', () => { sim.classList.remove('pula'); void sim.getBoundingClientRect(); sim.classList.add('pula'); });
  sim.querySelector('.dh-caixa').addEventListener('animationend', e => { if (e.animationName === 'dh-pulinho') sim.classList.remove('pula'); });
  const mira = () => {
    pedido = 0;
    const r = sim.getBoundingClientRect();
    const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height * .68), d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 200);
    sim.style.setProperty('--ox', (dx / d * 5.2 * k).toFixed(2) + '%');
    sim.style.setProperty('--oy', (dy / d * 3.8 * k).toFixed(2) + '%');
    sim.classList.add('segue');
  };
  addEventListener('pointermove', e => {
    x = e.clientX; y = e.clientY;
    if (!pedido) pedido = requestAnimationFrame(mira);
    clearTimeout(parado); parado = setTimeout(() => sim.classList.remove('segue'), 3000);
  }, { passive: true });
})();
</script>
</body>
